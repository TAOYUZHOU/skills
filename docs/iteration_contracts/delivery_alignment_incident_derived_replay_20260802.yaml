acceptance_criteria:
  - id: A1
    description: >-
      The three existing sanitized archetypes remain a required minimum, but an
      iteration with a distinct hash-bound live incident cannot claim historical
      replay coverage until every distinct incident signature is included.
  - id: A2
    description: >-
      Each incident-derived fixture binds its host capture and source hashes,
      enumerates all typed causal facts and real producer-consumer edges, maps
      every fact and edge to an executable oracle, and makes candidate-origin
      validation fail if a causal field or affected consumer is omitted.
  - id: A3
    description: >-
      Graph/admission replay covers accepted-versus-pending convergence,
      concrete negative event kinds, equal pre/post revision, immutable old row,
      and one successor under restart/concurrency; executor-repair replay covers
      exact selected-provider resolution through queue placeholder and worker
      guard into final backend selection and call-lease-linearized transport,
      unrelated-frozen-provider pass-through, selected-frozen and unknown
      routing no-call outcomes, admission-to-worker/final-backend provider drift
      rejection, accurate partial-call truth for delegated drift, exact
      freeze-observation-bound recovery, and full-row recovery CAS that cannot
      overwrite concurrent terminal or superseding truth,
      provider transport separately from missing/malformed machine decisions,
      zero unchanged blind retries, one typed terminal/upstream route, and one
      retry only after a canonical causal revision is hash-bound by a valid
      machine decision. Equal command text cannot distinguish a blind retry from
      a repaired retry, and a repair artifact or prose action cannot substitute
      for that decision. A typed decision must survive harmless concurrent
      subject-row churn by rebasing and committing once without provider recall;
      a semantic attempt change supersedes or routes it once, and an equal-prompt
      call after stale_decision_ignored fails the gate. The same replay overlaps
      a provider turn holding persisted repair custody with a lock-losing
      ordinary tick: the loser performs no competing subject-row write, the
      original decision commits once after restart, and a supersession receipt
      cannot bind equal decision/current semantic identities. Ownership-token
      custody remains held after provider return through final commit or durable
      supersession, release verifies ownership, and derived retry/route row
      collision reuses the existing decision without provider recall or false
      semantic supersession. Duplicate JSON keys at any object depth are
      malformed and cannot authorize retry or route. Terminal-projection replay separately exercises raw
      immutable graph intent, queue/DAG terminal truth, canonical active-plan
      rows, route selection, typed recovery, and one next-round admission.
      Review-manifest replay requires missing, foreign, attempt-mismatched, and
      timestamp-empty Result Review facts to fail closed through manifest,
      artifact, completion, and health consumers. Plan Review replay resolves
      the current contract and required captures at review time and rejects a
      superseded contract hash, missing or foreign current capture, or incomplete
      source/acceptance boundary before graph install, queue admission, or
      Executor launch; reviewer/provider success cannot override the mismatch.
  - id: A4
    description: >-
      Quick validation, targeted skill tests, diff hygiene, immutable candidate,
      and exact-diff adversarial review pass before the skill iteration is marked
      complete; runtime repair and workspace health remain independently open.

