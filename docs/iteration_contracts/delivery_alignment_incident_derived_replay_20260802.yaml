risks:
  - Policy prose alone cannot prove the Target C runtime candidate exercises the real producers and consumers; V5 remains a separate product-candidate gate.
  - The skill repository has unrelated dirty and untracked evidence; this iteration must not stage, commit, rewrite, or delete it.
  - The first policy draft was rolled back before this contract was frozen; no runtime or accepted skill candidate used that draft.

final_claims_allowed:
  - The iteration skill requires incident-derived replay in addition to its baseline corpus only after D1/D2 and V1-V4 pass.
  - No claim about runtime repair, provider root cause, deployment, or workspace health follows from this skill update.
  - Full goal completion additionally requires the Target C r4 candidate, reviews, deployment, and three-workspace observation in V5.

handoff:
  path: docs/harp_iteration_handoff.md
  policy: Update after every material skill edit, verification, candidate, review, blocker, or Target C evidence change.

sandbox:
  scope: Authoritative skill policy only; no HARP runtime writer or provider is reachable.
  fixture: The three immutable host captures, the Synthetic causal-revision progression addendum, the Target C stale-contract Plan Review, repair-CAS, both bootstrap exact-diff rejection addenda, selected-provider queue-freeze addendum, and the existing three bundled sanitized baseline profiles.
  invoke: Quick validation and targeted deterministic skill/checker tests.
  assert:
    - Baseline historical profiles are described as a minimum rather than exhaustive coverage.
    - All three observed incident chains have explicit negative and concurrency replay obligations.
    - Stale or incomplete Plan Review inputs fail before graph installation or queue admission.
    - Valid typed repair decisions commit once under harmless row churn without equal-prompt provider recall.
    - Provider-held repair custody overlapped by a lock-losing ordinary tick produces no competing subject-row write or equal-identity supersession, and duplicate-key decisions fail closed.
    - Ownership-token custody spans provider return through final commit, release is owner-checked, and derived retry/route row collisions reuse the existing decision without provider recall.
    - Exact selected-provider queue admission ignores unrelated frozen circuits without mutating them; selected freeze, unknown routing, and identity drift fail closed before provider call.
    - Final selected-provider transport admission is linearized under its call lease; freeze snapshots retain their exact observation identity, delegated drift preserves partial-call truth, and stale recovery or concurrent row changes cannot reopen work.
    - No command can write a live HARP workspace.
  record:
    - docs/harp_iteration_handoff.md

