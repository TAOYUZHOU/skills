schema_version: 3
intent: >-
  Replace the delivery-alignment iteration skill's candidate-authored,
  open-ended proof loop with a finite risk-tiered authorization model rooted in
  a candidate-external pinned verifier, frozen threat model, signed external
  phase ledger, admissible-finding rule, appeal path, and human budget breaker.
non_goals:
  - Modify HARP runtime, r8, live workspaces, or a post-v19 successor.
  - Claim that the new verifier can authorize its own gate-tool upgrade.
  - Remove historical schema-v1/v2 evidence parsers.
ssot:
  - path: skills/delivery-alignment-iteration/SKILL.md
    reason: Installed workflow instructions.
  - path: skills/delivery-alignment-iteration/references/trust_and_convergence.md
    reason: Normative trust, review, budget, and closure rules.
  - path: skills/delivery-alignment-iteration/scripts/check_iteration_convergence.py
    reason: Executable schema-v3 policy evaluator.
deliverables:
  - id: D1
    path: skills/delivery-alignment-iteration/SKILL.md
    description: Concise workflow with external TCB, tiered gates, and finite closure.
  - id: D2
    path: skills/delivery-alignment-iteration/references/trust_and_convergence.md
    description: Normative trust sequence and convergence policy.
  - id: D3
    path: skills/delivery-alignment-iteration/scripts/check_iteration_convergence.py
    description: Strict evaluator for contracts and signed external phase ledgers.
  - id: D4
    path: tests/test_delivery_alignment_convergence.py
    description: Directed tests for closure, blockers, budgets, review scope, and trust boundaries.
  - id: D5
    path: docs/delivery_alignment_iteration_handoff.md
    description: Phase-neutral durable handoff for this gate-tool upgrade.
acceptance_criteria:
  - id: A1
    description: Candidate-authored tools are evidence producers and cannot authorize promotion or receive private signing material.
  - id: A2
    description: The exact closure formula terminates by tier-required clean rounds, frozen in-model blockers, completeness, and budgets.
  - id: A3
    description: R0 through R3 select distinct ordered gate sets based on authority reachability and blast radius.
  - id: A4
    description: Reviewer findings cannot expand frozen criteria; ordinary appeals and emergency-P0 rulings require an adjudicator identity distinct from author and reviewer.
  - id: A5
    description: Candidate identity is recomputed from a host-prepared bare Git store, and signed T3 then T4/T5 predecessor receipts bind static review, gate, and acceptance evidence in order.
  - id: A6
    description: Historical v1/v2 CLI execution can audit evidence but always refuses promotion authority.
  - id: A7
    description: Skill validation, directed convergence tests, legacy regression tests, and two independent static/forward reviews pass for one frozen candidate.
verification:
  - id: V1
    command_or_check: python3 skill-creator/scripts/quick_validate.py skills/delivery-alignment-iteration
  - id: V2
    command_or_check: pytest -q tests/test_delivery_alignment_convergence.py
  - id: V3
    command_or_check: pytest -q tests/test_delivery_alignment_contract_checker.py tests/test_delivery_alignment_history_replay.py
  - id: V4
    command_or_check: Two independent reviewers inspect the exact frozen diff and execute forward scenarios.
  - id: V5
    command_or_check: A pinned external copy first reports authorize_execution, then rejects closure without its signed T3 authorization and T4/T5 predecessor receipt, and finally reports ready_for_external_acceptance from the complete chain.
traceability:
  - acceptance: A1
    deliverables: [D1, D2, D3]
    verification: [V2, V4, V5]
  - acceptance: A2
    deliverables: [D1, D2, D3, D4]
    verification: [V2, V4]
  - acceptance: A3
    deliverables: [D1, D2, D3, D4]
    verification: [V2]
  - acceptance: A4
    deliverables: [D2, D3, D4]
    verification: [V2, V4]
  - acceptance: A5
    deliverables: [D2, D3, D4]
    verification: [V2, V5]
  - acceptance: A6
    deliverables: [D1, D3]
    verification: [V3, V4]
  - acceptance: A7
    deliverables: [D1, D2, D3, D4, D5]
    verification: [V1, V2, V3, V4, V5]
risks:
  - This is a gate-tool upgrade; the new verifier can reach only ready_for_external_acceptance until its hash is accepted externally.
  - OpenSSL 3.x is a host dependency for Ed25519 ledger verification.
  - Existing schema-v2 evidence remains readable but is deliberately non-authorizing.
  - Nonblocking P2: the reusable gate-tool-upgrade pre-execution path relies on runner discipline to place the verifier outside the candidate; this iteration uses an external copy.
  - Nonblocking P2: requested_state open is not yet a closure veto; this exact contract requests close.
final_claims_allowed:
  - The schema-v3 skill candidate passed its bounded validation and is ready for external acceptance.
  - The accepted verifier may govern a separately frozen post-v19 decision; this iteration did not start that successor.
handoff:
  path: docs/delivery_alignment_iteration_handoff.md
  policy: Phase-neutral candidate truth freezes at T2; reviewer and closure state lives in the external signed ledger.
trust:
  verifier_origin: installed_skill
  verifier_version: trust-convergence-v1
  verifier_sha256: ffb4c0410956040a63d30c238d83a87daf96aa636f8b8e4256c51f4c933cb17c
  candidate_tool_role: untrusted_evidence_producer
  candidate_private_signing_material: forbidden
  bootstrap_mode: gate_tool_upgrade
