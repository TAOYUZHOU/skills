  root_anchor:
    external_signing_public_key_sha256: 5d812a61d5e72b5da2081d9b7290108a51d3a22daabbce38c97cf64ae9874fae
    base_commit: 7edfde64d56454a99e49a6be313b81bfc0b03498
    contract_hashes:
      - 7a3636b81f9dea85ccefcdf57ce0feb4f4003001aed492228bf20a4c15eb5da4
      - ae3f916a95f84d2c9ff8807674f6abdb3c97854be9bf040409fd86859739f4b1
      - dded3c6f664a0d853083349682a70b78ac9426490e9ffb7474c3ddd0a93470a2
threat_model:
  frozen: true
  protected_assets:
    - Promotion and cutover authority.
    - Frozen review criteria and closure receipt.
    - Host signing key and external phase truth.
  attacker_capabilities:
    - Candidate controls every byte in its repository and candidate-authored evidence.
    - Candidate controls its repository Git configuration, hooks, replacement refs, diff drivers, and text-conversion attributes.
    - Reviewer may propose incorrect or out-of-model requirements.
    - Candidate or operator may replay, omit, reorder, or mutate unsigned evidence.
    - Provider may fail, time out, or return malformed output.
  trusted_components:
    - Prior accepted schema-v2 checker only for historical audit and bootstrap evidence.
    - Two independent static reviewers of the exact gate-tool diff.
    - Host OpenSSL Ed25519 verifier and external public-key hash anchor.
    - Host-prepared candidate-external bare Git object store.
    - Human acceptance of the new verifier hash.
  excluded_capabilities:
    - Host kernel compromise.
    - Theft of the external Ed25519 private key.
    - Collision or preimage break of SHA-256 or forgery of Ed25519.
  security_properties:
    - id: SP1
      description: Candidate-contained code cannot issue a closure decision for its own or another product promotion.
    - id: SP2
      description: Only predeclared in-model deterministic P0/P1 findings block the frozen candidate; neither author nor original reviewer may adjudicate an ordinary appeal or emergency-P0 exception.
    - id: SP3
      description: Tier-specific clean rounds and bounded budgets produce a finite close, continue, or human-checkpoint decision.
    - id: SP4
      description: External signed phase truth binds the exact contract, candidate, tree, patch, paths, model, verifier, accepted T2.5 receipts, T3 authorization, and T4/T5 predecessor evidence; Git identity comes only from the host bare store.
    - id: SP5
      description: No private signing material or private-key path enters candidate inputs or subprocesses.
    - id: SP6
      description: Candidate identity is external freeze data and does not create a self-referential candidate contract.
  evidence_formats:
    - Strict YAML schema-v3 contract with duplicate-key rejection.
    - Canonical strict JSON phase ledger with detached Ed25519 signature.
    - Hash-bound static review, T3 authorization, T4/T5 runner, and Pytest/JUnit receipts.
risk_profile:
  tier: R3
  authority_reachability: true
  blast_radius: system
  rationale: This diff changes the root-of-trust, review, and promotion policy used by future self-evolve iterations.
  changed_paths:
    - docs/delivery_alignment_iteration_handoff.md
    - docs/iteration_contracts/delivery_alignment_trust_convergence_v3_20260804.yaml
    - skills/delivery-alignment-iteration/SKILL.md
    - skills/delivery-alignment-iteration/agents/openai.yaml
    - skills/delivery-alignment-iteration/references/harp_combined_chain_replay.md
    - skills/delivery-alignment-iteration/references/iteration_contract_schema.md
    - skills/delivery-alignment-iteration/references/trust_and_convergence.md
    - skills/delivery-alignment-iteration/scripts/check_delivery_contract.py
    - skills/delivery-alignment-iteration/scripts/check_iteration_convergence.py
    - skills/delivery-alignment-iteration/scripts/validate_harp_chain_evidence.py
    - tests/test_delivery_alignment_contract_checker.py
    - tests/test_delivery_alignment_convergence.py
  affected_dependencies: []
  required_gates:
    - static
    - targeted_regression
    - atomic_boundary
    - combined_chain_if_reachable
    - historical_replay_if_reachable
    - host_tcb
    - independent_adversarial_1
    - independent_adversarial_2
    - full_dynamic
review_policy:
  author_id: root-codex
  required_static_reviews: 2
  required_clean_rounds: 2
  max_appeals_per_finding: 1
  out_of_model_disposition: scope_expansion_proposal
  criteria_frozen: true
  reopen_rule: signed_property_invalidated
budgets:
  max_candidate_rejections: 2
  max_adversarial_rounds_per_candidate: 2
  max_new_attacks_per_round: 8
  max_active_engineering_hours_without_checkpoint: 4
  human_report_every_candidate_reviews: 2
  max_appeals_per_finding: 1
convergence:
